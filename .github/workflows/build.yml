name: Build SaHayak

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # No signing secrets configured yet, so this produces a debug-signed
      # release APK (installable for testing, not Play Store ready).
      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sahayak-release-apk
          path: frontend/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-web:
    name: Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: sahayak-web-build
          path: frontend/mobile/build/web
          retention-days: 30
