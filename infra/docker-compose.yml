# SaHayak local/free hosting. Run when Docker Desktop is installed.
# postgres+postgis, redis, minio. No AWS required.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sahayak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sahayak_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
volumes:
  sahayak_pg:
